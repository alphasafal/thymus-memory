[project]
name = "thymus-memory"
version = "0.1.0"
description = "Write-gates that keep poisoned memories out of LLM agent memory, and a harness that measures what they cost."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic"]

[project.scripts]
thymus-eval = "thymus.cli:main"
thymus-judge-check = "thymus.judgecheck:main"
thymus-report = "thymus.report:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thymus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
