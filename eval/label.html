  const lines = ITEMS.map((it, n) => JSON.stringify({ ...it.line, gold: labels[n] || "" })).join("\n") + "\n";
  const a = el("a"); a.href = URL.createObjectURL(new Blob([lines], { type: "application/jsonl" }));
  a.download = "heldout_labelled.jsonl"; a.click();
};
render();
